[project]
name = "stat"
version = "0.1.0"
description = "Spread Tutorial Automated Testing — extract executable shell blocks from MyST Markdown tutorials."
requires-python = ">=3.10"
dependencies = []  # extract_commands.py is stdlib-only by design

[dependency-groups]
dev = [
    "pytest",
    "pyyaml",
    "ruff",
]

[tool.ruff]
target-version = "py310"
line-length = 99
extend-exclude = ["tasks"]

[tool.ruff.lint]
select = ["E", "W", "F", "C90", "N", "D", "I"]
ignore = ["D203", "D213"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
