# tox configuration for STAT self-testing.
#
# Runs the tutorial pages (docs/tutorial/) through each wait_idle
# implementation (shell, jubilant, waitfor) plus a default target that runs
# all three sequentially.
#
# Usage:
#   tox -e stat-shell       # classic polling (default)
#   tox -e stat-jubilant    # Jubilant Python library
#   tox -e stat-waitfor     # juju wait-for (Juju 3.6 only)
#   tox -e stat-all         # run all three, one after another
#
# Prerequisites:
#   - Multipass installed and running
#   - Spread installed (go install github.com/canonical/spread/cmd/spread@latest)
#   - tox installed (apt install tox, or pip install tox)
#
# Each environment provisions a fresh Multipass VM, runs the tutorial pages,
# and discards the VM. The VM name is unique per implementation to avoid
# conflicts when running stat-all.

[tox]
envlist = stat-shell, stat-jubilant, stat-waitfor, stat-all
skipsdist = true

[testenv]
passenv =
    SPREAD_VM_CPUS
    SPREAD_VM_MEM
    SPREAD_VM_DISK
    SPREAD
    STAT_WAIT_IMPL
allowlist_externals =
    make
    spread
    python3

[testenv:stat-shell]
description = Run tutorial with classic polling wait_idle (STAT_WAIT_IMPL=shell)
setenv =
    STAT_WAIT_IMPL = shell
commands =
    make test

[testenv:stat-jubilant]
description = Run tutorial with Jubilant wait_idle (STAT_WAIT_IMPL=jubilant)
setenv =
    STAT_WAIT_IMPL = jubilant
commands =
    make test-jubilant

[testenv:stat-waitfor]
description = Run tutorial with juju wait-for wait_idle (STAT_WAIT_IMPL=waitfor)
setenv =
    STAT_WAIT_IMPL = waitfor
commands =
    make test-waitfor

[testenv:stat-all]
description = Run tutorial through all three wait_idle implementations sequentially
commands =
    {[testenv:stat-shell]commands}
    {[testenv:stat-jubilant]commands}
    {[testenv:stat-waitfor]commands}
