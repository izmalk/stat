[tox]
envlist = lint, unit, shell
skipsdist = True

[testenv]
basepython = python3

[testenv:lint]
description = Lint extract_commands.py and tests with ruff
skip_install = True
deps = ruff
commands =
    ruff check .
    ruff format --check --diff .

[testenv:unit]
description = Run the extractor unit tests (pytest)
skip_install = True
deps =
    pytest
    pyyaml
commands =
    pytest {posargs}

[testenv:shell]
description = Lint helpers.sh (shellcheck) and run bats tests with a mocked juju
skip_install = True
allowlist_externals =
    shellcheck
    bats
commands =
    shellcheck helpers.sh
    bats tests/bats

[testenv:all]
description = Run lint, unit and shell environments
skip_install = True
depends = lint, unit, shell
commands =
